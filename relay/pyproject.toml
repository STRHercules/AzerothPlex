[project]
name = "azerothplex-relay"
version = "1.0.0"
description = "State-only WebSocket relay for AzerothPlex Watch Together"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16"]

[project.scripts]
azerothplex-relay = "azerothplex_relay.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
